experiment_type: continuous_prefix

model:
  name: Qwen/Qwen3-1.7B
  freeze_backbone: true

data:
  dataset: stanfordnlp/wikitablequestions
  revision: refs/pr/4
  max_rows: 32
  max_cols: 8

cell_encoder:
  pooling: mean
  cell_dim: 128
  mlp_type: single

cnn:
  channels: 128
  depth: 2
  kernel_size: 3
  residual: true

training:
  bf16: true
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  epochs: 10
  seed: 42
  checkpoint_every_steps: 100
  early_stopping_patience: 1
  early_stopping_min_delta: 0.0
  auto_resume: true
  output_dir: outputs/continuous_prefix

generation:
  max_new_tokens: 32
