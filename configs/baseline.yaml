experiment_type: cnn

model:
  name: Qwen/Qwen3-1.7B
  freeze_backbone: true

data:
  dataset: stanfordnlp/wikitablequestions
  revision: refs/pr/4
  max_rows: 32
  max_cols: 8

cell_encoder:
  pooling: mean
  cell_dim: 256
  mlp_type: single

cnn:
  channels: 256
  depth: 2
  kernel_size: 3
  residual: true

cross_attention:
  insertion_layer: 13
  num_heads: 8
  gate_init: 0.1

training:
  bf16: true
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  epochs: 10
  seed: 42
  checkpoint_every_steps: 100
  early_stopping_patience: 3
  early_stopping_min_delta: 0.0
  auto_resume: true
  output_dir: outputs/baseline

generation:
  max_new_tokens: 32
